services:
  postgres:
    image: postgres:17.9-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Configura POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?Configura POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configura POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
      - ./db/migrations:/migrations:ro
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          pg_isready -h 127.0.0.1 -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}" &&
          PGPASSWORD="$${POSTGRES_PASSWORD}" psql -h 127.0.0.1
          -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}" -tAc
          "SELECT 1 FROM catalogo.schema_migration WHERE version='001'"
          | grep -qx 1
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    networks: [catalogo_net]
    restart: unless-stopped

  nestjs-backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:?Configura POSTGRES_DB}
      DB_USER: ${POSTGRES_USER:?Configura POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Configura POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?Configura JWT_SECRET}
      JWT_ISSUER: catalogo-ti
      JWT_AUDIENCE: catalogo-web
      DEMO_ADMIN_PASSWORD: ${DEMO_ADMIN_PASSWORD:-}
      DEMO_CONSULTA_PASSWORD: ${DEMO_CONSULTA_PASSWORD:-}
      DEMO_DESK_PASSWORD: ${DEMO_DESK_PASSWORD:-SA_desk_2026_demo}
      CMDB_SEED: ${CMDB_SEED:-202211515}
      CMDB_COUNT: ${CMDB_COUNT:-5000}
    ports:
      - "127.0.0.1:${BACKEND_PORT:-3000}:3000"
    volumes:
      - ./data:/app/data:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks: [catalogo_net]
    restart: unless-stopped
    init: true

  react-frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-8080}:80"
    depends_on:
      nestjs-backend:
        condition: service_healthy
    healthcheck:
      test: [CMD-SHELL, "wget -q -O /dev/null http://127.0.0.1/healthz || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks: [catalogo_net]
    restart: unless-stopped

  verificaciones:
    profiles: [pruebas]
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: verification
    network_mode: none

volumes:
  postgres_data:

networks:
  catalogo_net:
    driver: bridge
